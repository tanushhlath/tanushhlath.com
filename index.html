    <!--
      Sets data-theme on <html> before first paint — this is what avoids a
      flash of the wrong theme. Plain inline script, runs synchronously
      before anything else, no framework needed for this.
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
